<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    font-family: "PingFang TC", "Noto Sans TC", "Heiti TC", sans-serif;
    background: var(--bg-gradient, linear-gradient(135deg, #0f0c29, #302b63, #24243e));
    color: #fff;
    padding: 56px;
    overflow: hidden;
  }

  .title {
    font-size: 48px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 40px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
    line-height: 1.3;
  }

  .panels {
    display: flex;
    gap: 24px;
    justify-content: center;
  }

  .panel {
    flex: 1;
    min-height: 460px;
    border-radius: 20px;
    padding: 32px 28px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(12px);
    border: 1.5px solid rgba(255,255,255,0.15);
    display: flex;
    flex-direction: column;
  }

  .panel::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: var(--panel-bg);
    opacity: 0.18;
    z-index: 0;
  }

  .panel > * { position: relative; z-index: 1; }

  .panel-icon {
    font-size: 40px;
    margin-bottom: 12px;
  }

  .panel-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .panel-subtitle {
    font-size: 18px;
    font-weight: 400;
    opacity: 0.75;
    margin-bottom: 20px;
    line-height: 1.4;
  }

  .panel-points {
    list-style: none;
    flex: 1;
  }

  .panel-points li {
    font-size: 20px;
    line-height: 1.5;
    margin-bottom: 12px;
    padding-left: 24px;
    position: relative;
  }

  .panel-points li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 10px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
  }

  .panel-tag {
    display: inline-block;
    margin-top: 16px;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    align-self: flex-start;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 32px;
    font-size: 16px;
    opacity: 0.5;
  }

  /* Highlight panel (the recommended one) */
  .panel.highlight {
    border-color: rgba(255,255,255,0.3);
    box-shadow: 0 0 40px rgba(255,255,255,0.08);
    transform: scale(1.02);
  }
</style>
</head>
<body>
  <div class="title" id="title"></div>
  <div class="panels" id="panels"></div>
  <div class="footer">
    <span id="date"></span>
    <span id="author"></span>
  </div>

  <script>
    // Data is injected by the render script via page.evaluate()
    function render(data) {
      // Background
      if (data.bgGradient) {
        document.body.style.background = data.bgGradient;
      }

      // Title
      document.getElementById('title').textContent = data.title;

      // Footer
      document.getElementById('date').textContent = data.date || '';
      document.getElementById('author').textContent = data.author || '';

      // Panels
      const container = document.getElementById('panels');
      container.innerHTML = '';

      data.panels.forEach(p => {
        const div = document.createElement('div');
        div.className = 'panel' + (p.highlight ? ' highlight' : '');
        div.style.setProperty('--panel-bg', p.color || '#fff');
        div.style.setProperty('--accent', p.accent || p.color || '#fff');

        let html = '';
        if (p.icon) html += `<div class="panel-icon">${p.icon}</div>`;
        html += `<div class="panel-title">${p.panelTitle}</div>`;
        if (p.subtitle) html += `<div class="panel-subtitle">${p.subtitle}</div>`;

        html += '<ul class="panel-points">';
        (p.points || []).forEach(pt => {
          html += `<li>${pt}</li>`;
        });
        html += '</ul>';

        if (p.tag) html += `<div class="panel-tag">${p.tag}</div>`;
        div.innerHTML = html;
        container.appendChild(div);
      });

      // Adjust body height to content
      document.body.style.height = 'auto';
    }
  </script>
</body>
</html>
